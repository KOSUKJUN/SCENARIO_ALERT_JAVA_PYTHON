id: SR_AUTH_SUCCESS
name: 인증 성공
description: 인증 성공 분류 시그니처, 또는 IDS·IPS·TMS 페이로드에 SMTP 235 응답.
type: signature
entity: {type: host, field: dst_ip}
data_tp: [IDS, IPS, TMS]
filter:
  any:
    - {field: signature_category, op: eq, value: auth_success}
    - {field: payload, op: regex, value: '(^|\s)235[ -]'}
min_count: 1
window: 5m
exclude_lists: [false_positive_hosts]
schedule: 1m
alert_on_hit: false
severity: low
attack: [T1078]
d3fend: [D3-CRO, D3-ST, D3-MFA]
