id: SR_REMOTE_PORT_FANOUT
name: 외부 원격접속 포트 다수 접근
description: 내부 호스트가 10분 안에 외부 IP 다수의 원격접속 포트(3389/3390/33890/22/5900)로 접근.
type: count
entity: {type: host, field: src_ip}
data_tp: [FIREWALL, IPS, TMS]
filter:
  all:
    - {field: net_direction, op: eq, value: outbound}
    - {field: dst_port, op: in, value: [3389, 3390, 33890, 22, 5900]}
aggregate: {func: distinct_count, field: dst_ip}
window: 10m
threshold: 10
exclude_lists: [false_positive_hosts]
schedule: 1m
alert_on_hit: false
severity: medium
attack: [T1046, T1021.001]
