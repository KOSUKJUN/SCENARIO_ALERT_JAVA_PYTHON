# 기본값은 개발용이다. 운영 값은 환경 변수로만 넣는다 (저장소에 커밋하지 않는다).
server:
  port: ${API_PORT:8000}
  shutdown: graceful

spring:
  application:
    name: scenario-alert-engine
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/detect?characterEncoding=utf8}
    username: ${DB_USER:detect}
    password: ${DB_PASSWORD:detect_pw}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-init-sql: "SET time_zone='+09:00'"
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Seoul
  # ATT&CK STIX 번들 업로드 (enterprise 는 약 55MB)
  servlet:
    multipart:
      max-file-size: ${ATTACK_UPLOAD_MAX:200MB}
      max-request-size: ${ATTACK_UPLOAD_MAX:200MB}
  mvc:
    servlet:
      path: /

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs

logging:
  level:
    root: INFO
    org.flywaydb: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{24}: %msg%n"

app:
  mode: ${APP_MODE:server}
  instance-id: ${INSTANCE_ID:server}
  run-scheduler: ${RUN_SCHEDULER:false}
  enable-dev-tools: ${ENABLE_DEV_TOOLS:false}
  scheduler-tick-sec: ${SCHEDULER_TICK_SEC:5}
  max-concurrent-rules: ${MAX_CONCURRENT_RULES:4}
  eval-delay-sec: ${EVAL_DELAY_SEC:15}
  catchup-max-hours: ${CATCHUP_MAX_HOURS:24}
  catchup-steps-per-claim: ${CATCHUP_STEPS_PER_CLAIM:30}
  session-hours: ${SESSION_HOURS:12}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # 저장소 루트 (clickhouse/, rules/ 를 찾는 위치). 컨테이너에서는 /app
  root-dir: ${APP_ROOT_DIR:.}
  # MITRE ATT&CK STIX 번들을 두는 디렉터리 (폐쇄망 반입). 비우면 <root-dir>/data/attack. init 이 새 파일을 가져온다
  attack-dir: ${ATTACK_DIR:}
  d3fend-dir: ${D3FEND_DIR:}
  clickhouse:
    url: ${CH_URL:http://localhost:8123}
    user: ${CH_USER:detect}
    password: ${CH_PASSWORD:detect_pw}
    bt-user: ${CH_BT_USER:detect_bt}
    bt-password: ${CH_BT_PASSWORD:detect_bt_pw}
    admin-user: ${CH_ADMIN_USER:default}
    admin-password: ${CH_ADMIN_PASSWORD:admin_pw}
  case-system:
    webhook-url: ${CASE_WEBHOOK_URL:}
    service-token: ${CASE_SERVICE_TOKEN:}
  python:
    executable: ${PYTHON_EXECUTABLE:python3}
    runtime-dir: ${PYTHON_RUNTIME_DIR:./python}
    code-dir: ${SCENARIO_CODE_DIR:./data/scenarios}
    workers: ${PYTHON_WORKERS:2}
    timeout-sec: ${PYTHON_TIMEOUT_SEC:30}
  init:
    seed-sample: ${SEED_SAMPLE:false}
    sample-hours: ${SAMPLE_HOURS:2}
    builtin-status: ${BUILTIN_STATUS:active}
    # clickhouse/source/ (원본 로그·경보 테이블 사본) 를 init 이 만들고 reset-data 가 비워도 되는가. 실제 테이블이 있는 서버에서는 false
    manage-source: ${CH_MANAGE_SOURCE:false}
